# CoFinance 服务端配置
# 语法: key=value   '#' 开头为注释   值两端空白会被忽略
# 敏感项（数据库密码、LLM API Key）一律放 config/secrets.conf（该文件已被 .gitignore 排除）

# ---------- 网络 ----------
server.host=0.0.0.0
server.port=9006
server.backlog=512
server.io_threads=4
server.max_connections=20000
server.keepalive_timeout_ms=60000
server.request_timeout_ms=10000
server.long_poll_max_per_user=5
server.long_poll_max_per_group=200
server.long_poll_max_total=4096
server.ws_max_message_bytes=65536
server.ws_heartbeat_interval_ms=30000
server.ws_idle_timeout_ms=90000
server.ws_max_per_user=5
server.ws_max_per_group=200
server.ws_max_total=4096
server.header_limit_bytes=8192
server.body_limit_bytes=1048576
server.static_root=www

# ---------- 日志 ----------
log.dir=logs
log.file_prefix=cofinance
log.level=DEBUG
log.to_terminal=1
log.queue_size=65536

# ---------- 数据库（不含凭据）----------
db.host=127.0.0.1
db.port=3306
db.name=cofinance
db.pool_size=32
db.connect_timeout_ms=3000
db.acquire_timeout_ms=3000

# ---------- AI 助手（Key 只放 secrets.conf）----------
llm.base_url=https://api.deepseek.com
llm.model=deepseek-chat
llm.connect_timeout_ms=3000
llm.timeout_ms=10000
llm.max_tokens=600
llm.max_response_bytes=262144
llm.max_answer_bytes=16384
llm.worker_threads=2
llm.queue_capacity=64
llm.rate_limit_per_minute=5
llm.max_question_chars=500
llm.suggestion_cache_capacity=512
